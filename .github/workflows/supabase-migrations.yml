name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      register_existing_migrations:
        description: 'Mark migrations 202611050001–202611050003 as already applied'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SUPABASE_MIGRATIONS_BASELINED == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: jgqevvvmunqcurfmlobd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Register migrations previously run in SQL Editor
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.register_existing_migrations }}
        run: supabase migration repair 202611050001 202611050002 202611050003 --status applied --remote --yes

      - name: Apply pending migrations
        run: supabase db push --yes --remote
# Refresh workflow registration
